services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DB_PATH: /data/reconcileiq.db
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"   # local debugging only; public traffic goes through caddy
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - api
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
